<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የዕውቀት ፈተና - ሙከራ</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #0ea5e9;
      --success-bg: #dcfce7;
      --success-border: #16a34a;
      --success-text: #14532d;
      --error-bg: #fee2e2;
      --error-border: #dc2626;
      --error-text: #7f1d1d;
      --trial-bg: #fef3c7;
      --trial-border: #f59e0b;
      --trial-text: #78350f;
      --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 50%, #fdf4ff 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      font-family: "Noto Sans Ethiopic", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .app-card {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .hero-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .trial-badge {
      display: inline-block;
      background: var(--trial-bg);
      color: var(--trial-text);
      border: 1px solid var(--trial-border);
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-left: 6px;
      margin-bottom: 10px;
    }

    .creator-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--primary);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .creator-title {
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }

    .creator-detail {
      color: var(--text-main);
      font-weight: 600;
    }

    .center-box {
      text-align: center;
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 1.85rem;
      color: var(--primary-dark);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      color: var(--primary-dark);
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-num {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .setup-group {
      margin-bottom: 18px;
    }

    .setup-label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
      font-size: 0.98rem;
    }

    select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #f8fafc;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
      background: #ffffff;
    }

    .btn-primary {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.25);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--primary);
      border-radius: 14px;
      background: #ffffff;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--primary-light);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 0.95rem;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s ease;
    }

    .cat-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.55;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #f8fafc;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    .feedback-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.98rem;
      display: none;
    }

    .feedback-box.ok {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .feedback-box.bad {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .next-wrap {
      margin-top: 18px;
      display: none;
    }

    .next-wrap.show {
      display: block;
    }

    .score-ring {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--primary);
      margin: 14px 0 6px;
    }

    .percent-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .msg-text {
      font-size: 1.02rem;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 22px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="app-card">
    <!-- መነሻ ገጽ / ሙከራ መግቢያ -->
    <section id="start-screen">
      <div class="center-box">
        <span class="hero-tag">4 ምድቦች • Random</span>
        <span class="trial-badge">ሙከራ</span>
        <h1>የዕውቀት ፈተና</h1>
        <p class="subtitle">ምድብ እና የጥያቄ ብዛት መርጠው እውቀትዎን በጥያቄና መልስ ይፈትሹ!</p>
      </div>

      <div class="creator-card">
        <div class="creator-title">መግቢያ — ሙከራ</div>
        <div class="creator-detail">አዘጋጅ፡ ኪነጥበብ</div>
        <div class="creator-detail">ስልክ፡ 0921138738</div>
      </div>

      <div class="stats-strip">
        <div class="stat-pill">
          <div class="stat-num" id="total-q-count">200</div>
          <div class="stat-label">ጠቅላላ ጥያቄ</div>
        </div>
        <div class="stat-pill">
          <div class="stat-num">4</div>
          <div class="stat-label">ምድቦች</div>
        </div>
        <div class="stat-pill">
          <div class="stat-num">Random</div>
          <div class="stat-label">ያልተደጋገመ</div>
        </div>
      </div>

      <div class="setup-group">
        <label class="setup-label" for="category-select">የጥያቄ ምድብ ይምረጡ፦</label>
        <select id="category-select">
          <option value="all">ሁሉም ምድቦች (ድብልቅ)</option>
          <option value="history">የኢትዮጵያ ታሪክ እና ጂኦግራፊ</option>
          <option value="science">ሳይንስ፣ ጤና እና ተፈጥሮ</option>
          <option value="world">ዓለም አቀፍ ዕውቀት እና ባህል</option>
          <option value="tech">ቴክኖሎጂ፣ ሎጂክ እና ሒሳብ</option>
        </select>
      </div>

      <div class="setup-group">
        <label class="setup-label" for="count-select">በአንድ ዙር የሚጠየቁት ብዛት፦</label>
        <select id="count-select">
          <option value="10">10 ጥያቄዎች</option>
          <option value="20">20 ጥያቄዎች</option>
          <option value="50">50 ጥያቄዎች</option>
          <option value="200">200 ጥያቄዎች</option>
          <option value="500">እስከ 500 ጥያቄዎች</option>
        </select>
      </div>

      <button class="btn-primary" onclick="startQuiz()">ውድድሩን ጀምር</button>
    </section>

    <!-- የጥያቄ ገጽ -->
    <section id="quiz-screen" class="hidden">
      <div class="top-bar">
        <span id="q-counter">ጥያቄ 1 / 10</span>
        <span id="score-counter">ነጥብ: 0</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <span class="cat-badge" id="q-category">ምድብ</span>
      <div class="question-box" id="q-text"></div>
      <div class="options-grid" id="options-grid"></div>

      <div class="feedback-box" id="feedback-box"></div>

      <div class="next-wrap" id="next-wrap">
        <button class="btn-primary" id="next-btn" onclick="nextQuestion()">ቀጣይ ጥያቄ</button>
      </div>
    </section>

    <!-- የውጤት ገጽ -->
    <section id="result-screen" class="hidden center-box">
      <span class="hero-tag">ውድድሩ ተጠናቋል</span>
      <h2>የዙሩ ማጠቃለያ</h2>
      <div class="score-ring" id="result-score">0 / 10</div>
      <div class="percent-text" id="result-percent">0%</div>
      <p class="msg-text" id="result-msg"></p>
      <button class="btn-primary" onclick="startQuiz()">በዚሁ ምድብ እንደገና ሞክር</button>
      <button class="btn-secondary" onclick="goHome()">ወደ መነሻ ገጽ ተመለስ</button>
    </section>
  </main>

  <script>
    // =========================================================================
    // የጥያቄዎች ዝርዝር (አሁን 200 ጥያቄዎች፤ ተጨማሪ ጥያቄዎችን በክፍል እንጨምራለን)
    // =========================================================================
    const allQuestions = [
      // -----------------------------------------------------------------------
      // 1. የኢትዮጵያ ታሪክ እና ጂኦግራፊ (50 ጥያቄዎች)
      // -----------------------------------------------------------------------
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የኢትዮጵያ ዋና ከተማ ማን ናት?", options: ["ባህር ዳር", "አዲስ አበባ", "ሐዋሳ", "መቀሌ"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የአድዋ ድል የተቀዳጀው በየትኛው ዓ.ም ነው?", options: ["1880 ዓ.ም", "1888 ዓ.ም", "1896 ዓ.ም", "1933 ዓ.ም"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "በኢትዮጵያ ከፍተኛው ተራራ ማን ይባላል?", options: ["ራስ ዳሸን", "ባቱ ተራራ", "እንጦጦ", "ዝቋላ"], answer: 0 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የዓባይ ወንዝ መነሻ የሆነው ሐይቅ የትኛው ነው?", options: ["ሐይቅ ዝዋይ", "ሐይቅ ጣና", "ሐይቅ አባያ", "ሐይቅ ላንጋኖ"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የላሊበላ ውቅር አብያተ ክርስቲያናት የት ይገኛሉ?", options: ["አክሱም", "ላሊበላ", "ጎንደር", "ሐረር"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የአክሱም ሥልጣኔ በዋናነት በየትኛው ክልል ይገኛል?", options: ["ትግራይ", "ሶማሌ", "ጋምቤላ", "ቤንሻንጉል ጉሙዝ"], answer: 0 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የጎንደር ቤተ መንግሥት ግንቦች በብዛት በየትኛው ንጉሠ ነገሥት ዘመን ተገነቡ?", options: ["ዓፄ ቴዎድሮስ", "ዓፄ ፋሲለደስ", "ዓፄ ዮሐንስ", "ዳግማዊ ምኒልክ"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የኢትዮጵያ የብሔራዊ ባንክ የገንዘብ ዓይነት ምን ይባላል?", options: ["ዶላር", "ብር", "ዩሮ", "ሺሊንግ"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "በኢትዮጵያ የስምጥ ሸለቆ (Rift Valley) ውስጥ የሚገኝ ሐይቅ የትኛው ነው?", options: ["ሐይቅ ጣና", "ሐይቅ ዝዋይ", "ሐይቅ ሐይቅ", "ሐይቅ አሸንጌ"], answer: 1 },
      { cat: "history", catName: "ታሪክ እና ጂኦግራፊ", q: "የመጀመሪያው የኢትዮጵያ ባቡር መንገድ ከየት ወደ የት ነበር?", options: ["አዲስ አበባ - ጅቡቲ", "ባህር ዳር - ጎንደር", "መቀሌ - አክሱም", "ጂማ - ሐዋሳ"], answer: 0 },
